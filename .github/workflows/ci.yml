name: ci

# Actions minutes are free on a public repo, so this costs nothing.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  reply-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate self-test
        run: python3 .claude/hooks/reply_gate.py --self-test
      - name: Turn counter self-test
        run: python3 .claude/hooks/turn_counter.py --self-test
      - name: Delegate reminder self-test
        run: python3 .claude/hooks/delegate_reminder.py --self-test
      - name: Push-to-main blocker self-test
        run: python3 .claude/hooks/no_push_to_main.py --self-test
      - name: Manifests are valid JSON and register the hook
        run: |
          python3 - <<'PY'
          import json
          h = json.load(open(".claude/hooks/hooks.json"))
          cmds = [x["command"] for g in h["hooks"]["Stop"] for x in g["hooks"]]
          assert any("reply_gate.py" in c for c in cmds), "Stop hook not registered"
          # house-rules 3a's live counter. It ships in this plugin rather than
          # in a repo because "every repo" is the ask and a repo's settings.json
          # reaches only sessions rooted at that repo; a plugin already synced
          # fires in every session on every surface. A hook that stops being
          # registered looks exactly like one that never existed.
          assert any("turn_counter.py" in c for c in cmds), "turn counter not registered"
          # Rule 2's mechanical-task reminder — same argument, a different
          # hook event. A hook removed from hooks.json still passes its own
          # --self-test, so the self-test alone cannot catch de-registration.
          prompt_cmds = [x["command"] for g in h["hooks"].get("UserPromptSubmit", [])
                         for x in g["hooks"]]
          assert any("delegate_reminder.py" in c for c in prompt_cmds), (
              "delegate_reminder not registered as a UserPromptSubmit hook")
          # Rule 1's gate. Registered under PreToolUse/Bash rather than Stop,
          # and de-registering it looks exactly like never having had it.
          pre_cmds = [x["command"] for g in h["hooks"].get("PreToolUse", [])
                      for x in g["hooks"]]
          assert any("no_push_to_main.py" in c for c in pre_cmds), (
              "push-to-main blocker not registered as a PreToolUse hook")
          assert any(g.get("matcher") == "Bash" for g in h["hooks"].get("PreToolUse", [])), (
              "the PreToolUse group must match Bash or the gate never sees a command")
          # The subagent the reminder points at. A reminder naming an agent
          # that does not exist is worse than no reminder.
          import os
          agent_path = ".claude/agents/haiku-mechanic.md"
          assert os.path.isfile(agent_path), f"missing {agent_path}"
          agent_head = open(agent_path, encoding="utf-8").read(600)
          assert "name: haiku-mechanic" in agent_head, f"{agent_path} has no frontmatter name"
          assert "model: haiku" in agent_head, f"{agent_path} is not pinned to haiku"
          import sys
          sys.path.insert(0, ".claude/hooks")
          import delegate_reminder as _dr
          assert "load-house-rules:haiku-mechanic" in _dr.MESSAGE, (
              "reminder message must name the agent's actual scoped subagent_type")
          json.load(open(".claude/.claude-plugin/plugin.json"))
          json.load(open("gmor45-skills/.claude-plugin/plugin.json"))
          mkt = json.load(open(".claude-plugin/marketplace.json"))
          names = {p["name"] for p in mkt["plugins"]}
          assert names == {"load-house-rules", "gmor45-skills"}, names
          import os
          for skill in ("gartera-connect", "gartera", "flow", "full-dive"):
              path = f"gmor45-skills/skills/{skill}/SKILL.md"
              assert os.path.isfile(path), f"missing {path}"
          # The skills this plugin itself carries. A plugin that silently stops
          # shipping a skill looks exactly like one that never had it.
          for skill in ("load-house-rules", "wherewasi"):
              path = f".claude/skills/{skill}/SKILL.md"
              assert os.path.isfile(path), f"missing {path}"
              head = open(path, encoding="utf-8").read(400)
              assert head.startswith("---") and f"name: {skill}" in head, f"{path} has no frontmatter name"
          # The paste copy Garrett saves into his Cowork account by hand must
          # stay byte-identical to the skill. This is the failure that already
          # happened twice to the house-rules PASTE-ME (73 lines behind, then
          # 81) — caught by Garrett the first time, by a check the second.
          import filecmp
          a = ".claude/skills/wherewasi/SKILL.md"
          b = ".claude/skills/wherewasi/PASTE-ME.md"
          assert os.path.isfile(b), f"missing {b}"
          assert filecmp.cmp(a, b, shallow=False), (
              f"{b} has drifted from {a} — re-copy it, do not hand-edit either")
          print("manifests ok; Stop hook registered; 6 pointer skills present; "
                "wherewasi paste copy in sync")
          PY
